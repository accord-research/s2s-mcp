[project]
name = "s2s-mcp"
version = "0.1.0"
description = "Hosted MCP server that composes acmadDL and africas2s into seasonal-forecast recipes for thin agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "accord-research" }]
keywords = ["climate", "seasonal-forecasting", "mcp", "agents"]
dependencies = [
    "mcp>=2.2",
    # The two libraries this server composes. It adds recipes and plumbing on
    # top of their public verbs and their MCP tool functions; it holds no
    # data-access or forecasting logic of its own.
    "acmadDL[mcp]>=0.2",
    "africas2s[mcp]>=0.2",
    "xarray",
    "numpy",
    # Rhiza's weather-skills stack, so the host can serve acmadDL's
    # `weather-skills/*` products (IFS 46-day, GEFS 35-day, CHC SubC outlooks,
    # ERA5, IMERG, ...) and run their transforms. acmadDL keeps these in a uv
    # dependency *group* (PyPI metadata cannot carry git URLs) and groups do
    # not propagate to consumers, so this mirrors acmadDL's `weather-skills`
    # group. Keep the three git pins in [tool.uv.sources] identical to
    # acmadDL's: moving a pin there means re-captured fixtures and a
    # cache-version bump on their side.
    "weather-skills-core",
    "weather-skills",
    "chc-skills",
    "ecmwf-datastores-client==0.4.2",
    "dynamical-catalog==0.5.0",
    "pint-xarray>=0.6",
    "cf-xarray>=0.11",
    "aiohttp",
    "dask",
    "gcsfs",
    "h5netcdf",
    "h5py",
    "cartopy",
    "xarray-regrid",
    "nc-time-axis",
    "pillow",
    "shapely>=2.1",
]

[project.urls]
Repository = "https://github.com/accord-research/s2s-mcp"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx"]
# Shapefile regions for fetch(region="x.shp") and zonal statistics.
geo = ["acmadDL[geo]"]

[project.scripts]
s2s-mcp = "s2s_mcp.server:main"

[tool.uv.sources]
# The MCP servers are merged on main but not yet released to PyPI (latest
# there is 0.2.0 without the [mcp] extra). Track main until the next release,
# then delete this block so the PyPI pins above take over.
acmadDL = { git = "https://github.com/ACMAD-Niamey/acmadDL", branch = "main" }
africas2s = { git = "https://github.com/ACMAD-Niamey/africas2s", branch = "main" }
# Rhiza weather-skills provider packages, pinned to the same commits as
# acmadDL's pyproject (their `main` is a release branch that auto-bumps skill
# versions). Bump these only together with acmadDL.
weather-skills-core = { git = "https://github.com/rhiza-research/weather-skills-core", rev = "e118b9531181224cb1459efbd9f2b114117f0a79" }
weather-skills = { git = "https://github.com/rhiza-research/weather-skills", rev = "4f95364b323e601f5cbd43ee3af39d2d77617596" }
chc-skills = { git = "https://github.com/rhiza-research/chc-skills", rev = "20bce784a77a10a1fe7a368e29669a5d673eb176" }

[tool.uv]
# sheerwater (via acmadDL) hard-pins zarr==2.18.3 and xarray==2025.1.0; both
# pins are stale and acmadDL overrides them so icechunk (zarr>=3) and the Rhiza
# weather-skills stack (xarray>=2026.7) co-resolve. Mirror acmadDL's overrides
# here so the host env resolves the same way.
override-dependencies = ["zarr>=3.1.0", "xarray>=2026.7"]
# eccodeslib only ships wheels for some platforms at its newest versions;
# listing the environments we develop and deploy on makes uv pick a version
# with wheels for all of them (Linux containers in production, Apple Silicon
# laptops for development).
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2s_mcp"]
# The skill ships in the wheel: the hosted server serves it as a resource.
force-include = { "skills/s2s" = "s2s_mcp/skill" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # tests import helpers as `tests.conftest`; works under bare `pytest` and `python -m pytest` alike
